# The executable targets are placeholders. Replace them with browser paths
# available on your host before using this configuration.
default = "personal"

[browsers.personal]
command = "/path/to/personal-browser"

[browsers.work]
command = "/path/to/work-browser"

[browsers.dev]
command = "/path/to/development-browser"

[route_command]
# Relative executables resolve beside this config, not from the cwd.
command = ["./route.py"]

# This rule proves that @default defers to static routing. A work URL outside
# hours returns personal explicitly instead, so this rule cannot reactivate it.
[[rules]]
name = "Static personal fallback"
matcher = "exact-host"
pattern = "personal.example.test"
target = "personal"
